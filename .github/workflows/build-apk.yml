name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nearfield-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest test APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Nearfield Android test build
          body: Test APK built from the latest main branch. Android may ask you to allow installation from your browser.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: false
